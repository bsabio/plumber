name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Upgrade npm to match local lockfile format
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --run

      - name: Build (requires env vars; may fail in CI without secrets)
        run: npm run build
        continue-on-error: true
        env:
          AUTH_SECRET: ci-test-secret-32-chars-min-please-okay
          NODE_ENV: production
